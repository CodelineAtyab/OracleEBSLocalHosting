# lab-portal - static status page for the EBS training lab.
# Deployed to /etc/nginx/sites-available/lab-portal by portal-install.sh.
# Read-only: nginx serves files from /var/www/lab-portal and nothing else.
server {
    listen 8080 default_server;
    server_name _;

    root /var/www/lab-portal;
    index index.html;
    autoindex off;
    charset utf-8;

    include /etc/nginx/snippets/lab-portal-headers.conf;

    # Data file: always fresh, never cached (Cloudflare sits in front later).
    location = /state.json {
        include /etc/nginx/snippets/lab-portal-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # no dotfiles, no partially written temp files
    location ~ /\. { deny all; }
    location ~ \.tmp$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
