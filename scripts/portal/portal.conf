# portal.conf - build defaults for scripts/portal-install.sh.
# The collector-specific keys are also copied into the container as
# /etc/lab-portal/portal.conf.
#
# This file holds NO secrets.  The Proxmox API token is created on the host by
# portal-install.sh and pushed into the container (mode 0600); it is never
# written to the repo.

# --- container (host side) -------------------------------------------------
PORTAL_VMID=9300
PORTAL_HOSTNAME=lab-portal
PORTAL_IP=192.168.100.250
PORTAL_GW=192.168.100.1
PORTAL_CORES=1
PORTAL_MEMORY=512
PORTAL_SWAP=256
PORTAL_DISK=2
# Pinned so a router DHCP reservation for PORTAL_IP survives a rebuild.
PORTAL_MAC=BC:24:11:E0:A8:4A
PORTAL_STORAGE=local-lvm
PORTAL_TMPL_STORAGE=local
PORTAL_TEMPLATE=debian-13-standard_13.6-1_amd64.tar.zst
PORTAL_PORT=8080

# --- this Proxmox endpoint (add more with portal-add-host.sh) --------------
PORTAL_SITE_LABEL=site-a
PORTAL_ENDPOINT_URL=https://192.168.100.222:8006

# --- collector (pushed into /etc/lab-portal/portal.conf) -------------------
COLLECT_INTERVAL=10
PROBE_TIMEOUT=5
CYCLE_BUDGET=30
APP_PORT=8000
APPS_PATH=/OA_HTML/AppsLogin
DB_PORT=1521
DB_SID=EBSDB
VNC_PORT=5900
VNC_PROBE_EVERY=6
WEB_ROOT=/var/www/lab-portal
ENDPOINTS_FILE=/etc/lab-portal/endpoints.conf
